<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pr0j3ct_R3Tr0</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖥️</text></svg>">
</head>

<body>
    <div id="tela-login">
        <div class="login-layout">
            <div class="login-faixa login-faixa-topo"></div>

            <div class="login-centro">
                <div class="login-esquerda">
                    <h1>Pr0j3ct_R3Tr0</h1>
                    <p>Para começar, digite o seu nome</p>
                </div>

                <div class="login-divisor"></div>

                <div class="login-direita">
                    <div class="login-avatar">👤</div>
                    <div class="login-campos">
                        <input type="text" id="input-nome" placeholder="Nome do usuário" maxlength="20" autocomplete="off" autofocus>
                        <button id="botao-entrar">Entrar</button>
                    </div>
                </div>
            </div>

            <div class="login-faixa login-faixa-base"></div>
        </div>
    </div>

    <div id="popup" class="janela ativa escondido">
        <div class="janela-titulo">
            <span>Aviso</span>
            <div class="janela-botoes">
                <button id="popup-fechar" class="janela-fechar">X</button>
            </div>
        </div>
        <div class="popup-corpo">
            <span class="popup-icone">⚠️</span>
            <p id="popup-mensagem"></p>
        </div>
        <button id="popup-ok">OK</button>
    </div>

    <div id="tela-desktop" class="escondido">
        <div id="area-trabalho">
            <div id="area-icones">
            </div>
        </div>

        <div id="barra-tarefas">
            <button id="botao-iniciar">⊞ Iniciar</button>
            <div id="botoes-janelas"></div>
            <div id="bandeja">
                <span>👤 <span id="nome-usuario"></span></span>
                <span id="relogio"></span>
            </div>
        </div>
        <div id="menu-iniciar" class="escondido">
            <div class="menu-cabecalho">
                <span class="menu-avatar">👤</span>
                <span id="menu-nome-usuario"></span>
            </div>
            <div id="menu-programas"></div>
            <div class="menu-rodape">
                <button id="botao-sair">⏻ Sair</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
