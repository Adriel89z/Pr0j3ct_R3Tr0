<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pr0j3ct_R3Tr0</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="tela-login">
        <input type="text" id="input-nome" placeholder="Nome do Usuário" maxlength="20">
        <button id="botao-entrar">Entrar</button>
    </div>

    <div id="popup" class="janela escondido">
        <div class="janela-titulo">
            <span>Aviso</span>
            <button id="popup-fechar">X</button>
        </div>
        <div class="popup-corpo">
            <span class="popup-icone">⚠️</span>
            <p id="popup-mensagem"></p>
        </div>
        <button id="popup-ok">OK</button>
    </div>

    <div id="tela-desktop" class="escondido">
        <div id="area-trabalho">
            <div id="area-icones">
            </div>
        </div>

        <div id="barra-tarefas">
            <button id="botao-iniciar">⊞ Iniciar</button>
            <div id="botoes-janelas"></div>
            <div id="bandeja">
                <span>👤 <span id="nome-usuario"></span></span>
                <span id="relogio"></span>
            </div>
        </div>
        <div id="menu-iniciar" class="escondido">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
